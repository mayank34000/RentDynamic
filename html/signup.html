<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RentFlow- Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/signup.css" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="../assets/video.mp4" type="video/mp4">
    </video>


    <div id="container">

        <header class="logo" style="text-align: center;">
            Rent<span>Flow</span>
        </header>

        <br>

        <h1 class="title" style="text-align: center;">
            Create your account
        </h1>

        <p class="subtitle" style="text-align: center;">
            Start renting smarter with RentFlow.
        </p>

        <br>


        <!-- FULL NAME -->
        <div class="input-field">
            <label>Full Name</label>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >
        </div>


        <!-- EMAIL -->
        <div class="input-field">
            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >
        </div>


        <!-- PHONE -->
        <div class="input-field">
            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >
        </div>


        <!-- PASSWORD -->
        <div class="input-field">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="input-field">
            <label>Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                placeholder="Confirm your password"
                required
            >
        </div>


        <!-- TERMS -->
        <div>
            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            />

            <label for="terms" class="terms-label">
                I agree to the
                <a href="#" class="link">Terms &amp; Conditions</a>
            </label>

            <span id="terms-error" class="error-msg"></span>
        </div>


        <!-- NORMAL SIGNUP -->
        <button
            type="button"
            id="signup-submit"
            class="btn primary-btn"
            onclick="handleSubmit()"
        >
            Sign Up
        </button>


        <div class="divider">
            <span>OR</span>
        </div>


        <!-- GOOGLE SIGN-IN -->
        <div
            id="google-btn"
            class="google-login-container"
        ></div>


        <p class="login-link">
            Already have an account?
            <a href="login.html" class="link">Login</a>
        </p>

    </div>


    <script src="../js/signup.js"></script>

</body>
</html>
