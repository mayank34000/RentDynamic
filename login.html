<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentFlow-Login</title>
    <link rel="stylesheet" href="css/signup.css" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"rel="stylesheet">
</head>
<body>


    <video class="bg-video" autoplay muted loop playsinline>
        <source src="assets/video.mp4" type="video/mp4">
    </video>

    <div id="container">

        <header class="logo" style="text-align: center; color: #B0AEAD;">Rent<span>Flow</span></header>
    <br>
    <h1 class="title" style="text-align: center;">Create your account</h1>
    <p class="subtitle" style="text-align: center;">Start renting smarter with RentFlow.</p>
    <br>

        <div class="input-field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email address" required>
        </div>

        <div class="input-field"><label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div >
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms" class="terms-label">
            I agree to the <a href="#" class="link">Terms &amp; Conditions</a>
            </label>
            <span id="terms-error" class="error-msg"></span>
        </div>

         <button type="submit" id="signup-submit" class="btn primary-btn" onclick="handleLogin()" style="background-color: #1b2540; color: white;">Log In</button>

        <div class="divider"><span>OR</span></div>

         <button type="button" id="google-btn" class="btn social-btn google-btn" style="background-color: white;"><img src="assets/google.png"alt="Google"class="social-icon">
            Continue with Google
        </button>
        <!-- <button type="button" id="facebook-btn" class="btn social-btn facebook-btn" style="background-color: white;"><img src="assets/facebook.png"alt="Facebook"class="social-icon">
            Continue with Facebook
        </button> -->
        <p class="login-link">
            Don't have an account? <a href="signup.html" class="link">Sign Up</a>
        </p>

    </div>




    <!-- <footer class="footer">
        © 2026 RentFlow. All rights reserved.
    </footer> -->
</body>
</html>

<script src="js/login.js"></script>
