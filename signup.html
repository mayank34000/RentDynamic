    <link rel="stylesheet" href="css/signup.css" />

<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="assets/video.mp4" type="video/mp4">
    </video>

    <!-- <header class="logo">Rent<span>Flow</span></header>

    <div id="container">

        <header class="logo" style="text-align: center;">Rent<span>Flow</span></header>
    <br>
    <h1 class="title" style="text-align: center;">Create your account</h1>
    <p class="subtitle" style="text-align: center;">Start renting smarter with RentFlow.</p>
    <br>


        <div class="input-field">
    <label>Full Name</label>
    <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required
    >
</div>

<div class="input-field">
    <label>Email Address</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
    >
</div>

<div class="input-field">
    <label>Phone Number</label>
    <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
    >
</div>

<div class="input-field">
    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    >
</div>

<div class="input-field">
    <label>Confirm Password</label>
    <input
        type="password"
        id="confirm_password"
        placeholder="Confirm your password"
        required
    >
</div>

        <div >
            <input type="checkbox" id="terms" name="terms" required />
            <label for="terms" class="terms-label">
            I agree to the <a href="#" class="link">Terms &amp; Conditions</a>
            </label>
            <span id="terms-error" class="error-msg"></span>
        </div>

        <button type="submit" id="signup-submit" class="btn primary-btn" onclick="handleSubmit()">Sign Up</button>

        <div class="divider"><span>OR</span></div>

         <button type="button" id="google-btn" class="btn social-btn google-btn"><img src="assets/google.png"alt="Google"class="social-icon">
            Continue with Google
        </button>
        <!-- <button type="button" id="facebook-btn" class="btn social-btn facebook-btn"><img src="assets/facebook.png"alt="Facebook"class="social-icon">
            Continue with Facebook
        </button> -->
        <p class="login-link">
            Already have an account? <a href="login.html" class="link">Login</a>
        </p>

    </div>
<!-- 
    <footer class="footer">© 2026 RentFlow. All rights reserved.</footer> -->
    
</body>
</html>
